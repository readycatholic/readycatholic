name: Generate Parish SEO Pages

on:
  push:
    branches: [main]
    paths:
      - 'parish/data/**'
      - 'scripts/generate_parish_pages.py'
      - '.github/workflows/generate-parish-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate static parish pages
        run: python3 scripts/generate_parish_pages.py

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add parish/
          if git diff --staged --quiet; then
            echo "No parish page changes"
          else
            git commit -m "Generate SEO parish static pages [skip ci]"
            git push
          fi
