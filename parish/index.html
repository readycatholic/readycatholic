<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Find Your Local Parish | Ready Catholic</title>
  <meta name="robots" content="index, follow" />
  <meta name="description" content="Find your local Catholic parish by ZIP code. Search parishes in the Archdiocese of Miami, Diocese of Palm Beach, and Diocese of Orlando." />
  <link rel="canonical" href="https://readycatholic.github.io/readycatholic/parish/" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/parish.css" />
  <style>
    .top-ad {
      text-align: center;
      padding: 0.75rem 1rem 0;
    }
    .top-ad a {
      display: inline-block;
      line-height: 0;
    }
    .top-ad img {
      display: block;
      width: min(100%, 728px);
      height: auto;
      margin: 0 auto;
      border-radius: 8px;
    }
    header {
      text-align: center;
      padding: 1.25rem 1rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    header a.brand {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0.75rem 0 0.35rem;
      font-size: 1.75rem;
      font-weight: normal;
    }
    .sub {
      color: var(--muted);
      font-size: 0.95rem;
      margin: 0;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 1.75rem 1rem 3rem;
    }
    form {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }
    input[type="text"] {
      flex: 1;
      min-width: 160px;
      padding: 0.85rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
      font-size: 1.05rem;
      font-family: inherit;
    }
    input::placeholder { color: var(--muted); }
    button {
      padding: 0.85rem 1.25rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #1a1508;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover { filter: brightness(1.08); }
    #parish-status {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    .parish-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .parish-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.15rem;
      margin-bottom: 0.75rem;
    }
    .parish-card h3 {
      margin: 0 0 0.35rem;
      font-size: 1.15rem;
      font-weight: normal;
      color: var(--accent);
    }
    .parish-card .addr { margin: 0.2rem 0; }
    .parish-card .meta,
    .parish-card .phone {
      margin: 0.2rem 0;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .parish-card a {
      display: inline-block;
      margin-top: 0.4rem;
      color: var(--accent);
      font-size: 0.9rem;
    }
    .empty {
      color: var(--muted);
      background: var(--card);
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.8rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="top-ad">
    <a aria-label="Learn more from Catholic Order of Foresters" href="https://getmyannuitycom-22173203.hubspotpagebuilder.com/readycatholic-helping-catholic-families-be-ready" rel="noopener noreferrer" target="_blank">
      <img alt="Catholic Order of Foresters — Insurance shaped by Catholic values. Learn More." src="../COF728X90.png" width="728" height="90" />
    </a>
  </div>
  <header>
    <a class="brand" href="../">Ready Catholic</a>
    <h1>Find Your Local Parish</h1>
    <p class="sub">Enter a ZIP code to find nearby Catholic parishes</p>
  </header>
  <main>
    <form id="parish-search-form" action="#" method="get">
      <input
        id="zip-input"
        type="text"
        name="zip"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="10"
        autocomplete="postal-code"
        placeholder="Enter ZIP code"
        aria-label="Enter ZIP code"
      />
      <button type="submit">Search</button>
    </form>
    <p id="parish-status">Loading parish data…</p>
    <div id="parish-results"></div>
  </main>
  <footer>
    <a href="../">← Back to Ready Catholic news</a>
  </footer>
  <script src="js/search.js"></script>
</body>
</html>
