<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Saint Sebastian | Ready Catholic Parish</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Saint Sebastian — Sebastian, FL 32958. Diocese of Palm Beach." />
  <link rel="icon" href="../../../favicon.svg" type="image/svg+xml" />
  <style>
    :root { --bg: #0f1419; --card: #1a222d; --text: #f2f0e8; --muted: #a8a295; --accent: #c9a227; --border: #2c3644; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Georgia, serif; background: var(--bg); color: var(--text); line-height: 1.55; min-height: 100vh; }
    header { text-align: center; padding: 1.5rem 1rem; border-bottom: 1px solid var(--border); }
    header a.brand { color: var(--accent); text-decoration: none; font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; }
    main { max-width: 640px; margin: 0 auto; padding: 1.75rem 1rem 3rem; }
    .crumb { font-size: 0.85rem; color: var(--muted); margin-bottom: 1.25rem; }
    .crumb a { color: var(--accent); text-decoration: none; }
    h1 { margin: 0 0 0.35rem; font-size: 1.65rem; font-weight: normal; color: var(--accent); }
    .diocese { color: var(--muted); margin: 0 0 1.25rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1.15rem 1.25rem; }
    .card p { margin: 0.4rem 0; }
    .label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; }
    a.btn { display: inline-block; margin-top: 0.75rem; margin-right: 0.5rem; padding: 0.55rem 0.9rem; background: var(--accent); color: #1a1508; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 0.9rem; }
    a.btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .pilot { font-size: 0.8rem; color: var(--muted); margin-top: 1.5rem; }
    footer { text-align: center; padding: 1.25rem; font-size: 0.8rem; color: var(--muted); border-top: 1px solid var(--border); }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <header><a class="brand" href="../../../">Ready Catholic</a></header>
  <main>
    <p class="crumb"><a href="../../">Find a Parish</a> · ZIP 32958</p>
    <h1>Saint Sebastian</h1>
    <p class="diocese">Diocese of Palm Beach</p>
    <div class="card">
      <p class="label">Address</p>
      <p>13075 US Highway 1<br>Sebastian, FL 32958</p>
      <p class="label">Phone</p>
      <p>772-589-5790</p>
      <p class="label">Website</p>
      <p><a href="https://www.stsebastian.com/" target="_blank" rel="noopener noreferrer" style="color:var(--accent)">stsebastian.com</a></p>
      <p><a class="btn" href="https://www.stsebastian.com/" target="_blank" rel="noopener noreferrer">Visit parish website</a>
      <a class="btn secondary" href="https://www.google.com/maps/search/?api=1&query=Saint+Sebastian,+13075+US+Highway+1,+Sebastian,+FL+32958" target="_blank" rel="noopener noreferrer">Open in Maps</a></p>
    </div>
    <p class="pilot">Pilot page — not linked from homepage yet.</p>
  </main>
  <footer><a href="../../">← Back to parish search</a></footer>
</body>
</html>
